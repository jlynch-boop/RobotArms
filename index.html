<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robot Arms AI - Building the future of robotics automation">
  <title>Robot Arms AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.33);
      --accent2: #00d4ff;
      --text: #e0e0e8;
      --text-dim: #8888a0;
      --token-keyword: #ff79c6;
      --token-string: #f1fa8c;
      --token-function: #8be9fd;
      --token-number: #bd93f9;
      --token-variable: #50fa7b;
      --token-comment: #6272a4;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }
    
    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(var(--accent-glow) 1px, transparent 1px),
        linear-gradient(90deg, var(--accent-glow) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.3;
    }
    
    .robot-container {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      width: 280px;
      height: 360px;
    }
    
    .robot-arm {
      width: 100%;
      height: 100%;
    }
    
    .code-block {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: var(--bg-card);
      padding: 10px 14px;
      padding-top: 24px;
      border-radius: 6px;
      border: 1px solid #2a2a3e;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      white-space: nowrap;
      z-index: 10;
    }
    
    .code-block::before {
      content: '';
      position: absolute;
      top: 7px;
      left: 7px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--token-variable);
      box-shadow: 10px 0 0 var(--token-string), 20px 0 0 var(--token-keyword);
    }
    
    .code-block::after {
      content: '';
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
    }
    
    .token { display: inline; }
    .keyword { color: var(--token-keyword); }
    .string { color: var(--token-string); }
    .func { color: var(--token-function); }
    .num { color: var(--token-number); }
    .var { color: var(--token-variable); }
    .comment { color: var(--token-comment); font-style: italic; }
    
    .block-1 { top: 18%; left: 6%; animation: float1 5s ease-in-out infinite; }
    .block-2 { top: 14%; right: 8%; animation: float2 6s ease-in-out infinite; }
    .block-3 { bottom: 32%; left: 10%; animation: float3 5.5s ease-in-out infinite; }
    .block-4 { bottom: 26%; right: 6%; animation: float1 7s ease-in-out infinite reverse; }
    
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6px, -12px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-8px, -10px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(8px, -10px); }
    }
    
    .logo {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text);
      opacity: 0.8;
      z-index: 30;
    }
    .logo span {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .banner {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      text-align: center;
    }
    
    .banner-inner {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 16px 32px;
      background: linear-gradient(135deg, #1a1a2e 0%, #12121a 100%);
      border: 1px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 0 25px var(--accent-glow);
    }
    
    .wrench {
      font-size: 20px;
      animation: wrenchWave 1s ease-in-out infinite;
    }
    .wrench:last-child { animation-delay: 0.5s; }
    @keyframes wrenchWave {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    
    h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }
    
    .subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 3px;
    }
    
    .email-form {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    
    .email-input {
      padding: 8px 12px;
      font-size: 12px;
      font-family: 'Space Grotesk', sans-serif;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(108, 99, 255, 0.3);
      border-radius: 5px;
      color: var(--text);
      width: 180px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .email-input::placeholder { color: var(--text-dim); }
    .email-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    
    .submit-btn {
      padding: 8px 16px;
      font-size: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, #8b7fff 100%);
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px var(--accent-glow);
    }
    
    @media (max-width: 768px) {
      .robot-container { width: 180px; height: 240px; bottom: 16%; }
      .code-block { font-size: 9px; padding: 6px 8px; padding-top: 18px; }
      .block-1 { top: 10%; left: 2%; }
      .block-2 { top: 8%; right: 2%; }
      .block-3 { bottom: 36%; left: 4%; }
      .block-4 { bottom: 30%; right: 2%; }
      .logo { font-size: 13px; }
      h1 { font-size: 16px; }
      .banner-inner { padding: 12px 20px; gap: 12px; }
      .wrench { font-size: 16px; }
      .email-form { flex-direction: column; align-items: center; }
      .email-input { width: 160px; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="grid"></div>
    <div class="logo">ROBOT<span>ARMS</span>.AI</div>
    
    <div class="code-block block-1">
      <span class="token keyword">const</span> <span class="token var">arm</span> = <span class="token func">init</span>()
    </div>
    <div class="code-block block-2">
      <span class="token var">arm</span>.<span class="token func">move</span>(<span class="token num">360</span>)
    </div>
    <div class="code-block block-3">
      <span class="token keyword">while</span> (<span class="token var">build</span>) { <span class="token func">run</span>() }
    </div>
    <div class="code-block block-4">
      <span class="token comment">// coming soon</span>
    </div>
    
    <div class="robot-container">
      <svg class="robot-arm" viewBox="0 0 280 360" xmlns="http://www.w3.org/2000/svg">
        <!-- Base - FIXED at bottom -->
        <g id="base">
          <rect x="80" y="310" width="120" height="45" fill="#2a2a3e" rx="6"/>
          <rect x="90" y="318" width="100" height="30" fill="#3a3a4e" rx="4"/>
          <rect x="100" y="323" width="80" height="20" fill="#1a1a2e" rx="2"/>
          <!-- Indicator lights -->
          <circle cx="115" cy="333" r="4" fill="#50fa7b">
            <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="140" cy="333" r="4" fill="#6c63ff">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="165" cy="333" r="4" fill="#50fa7b">
            <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
          </circle>
        </g>
        
        <!-- Shoulder at (140, 310) - where upper arm rotates -->
        <g id="shoulder">
          <circle cx="140" cy="310" r="18" fill="#3a3a4e"/>
          <circle cx="140" cy="310" r="10" fill="#5a5a6e"/>
          
          <!-- Upper arm - rotates around shoulder -->
          <g id="upperArm">
            <animateTransform 
              attributeName="transform" 
              type="rotate" 
              values="0 140 310; 30 140 310; 50 140 310; 20 140 310; -20 140 310; 0 140 310"
              keyTimes="0; 0.15; 0.35; 0.55; 0.75; 1"
              dur="8s" 
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
            />
            
            <!-- Upper arm segment -->
            <rect x="132" y="200" width="16" height="115" fill="#4a4a5e" rx="5"/>
            <rect x="135" y="205" width="10" height="105" fill="#5a5a6e" rx="3"/>
            
            <!-- Elbow at (140, 200) - where forearm rotates -->
            <g id="elbow">
              <circle cx="140" cy="200" r="15" fill="#3a3a4e"/>
              <circle cx="140" cy="200" r="9" fill="#5a5a6e"/>
              
              <!-- Forearm - rotates around elbow -->
              <g id="forearm">
                <animateTransform 
                  attributeName="transform" 
                  type="rotate" 
                  values="-10 140 200; -60 140 200; -80 140 200; -50 140 200; 10 140 200; -10 140 200"
                  keyTimes="0; 0.15; 0.35; 0.55; 0.75; 1"
                  dur="8s" 
                  repeatCount="indefinite"
                  calcMode="spline"
                  keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
                />
                
                <!-- Forearm segment -->
                <rect x="132" y="110" width="16" height="95" fill="#4a4a5e" rx="5"/>
                <rect x="135" y="114" width="10" height="87" fill="#5a5a6e" rx="3"/>
                
                <!-- Wrist at (140, 110) - where claw rotates -->
                <g id="wrist">
                  <circle cx="140" cy="110" r="12" fill="#3a3a4e"/>
                  <circle cx="140" cy="110" r="7" fill="#5a5a6e"/>
                  
                  <!-- Wrist segment -->
                  <rect x="132" y="60" width="16" height="55" fill="#4a4a5e" rx="4"/>
                  <rect x="135" y="63" width="10" height="49" fill="#5a5a6e" rx="2"/>
                  
                  <!-- Claw fingers - animate open/close -->
                  <g id="fingers">
                    <!-- Left finger -->
                    <rect x="124" y="35" width="10" height="35" fill="#5a5a6e" rx="4">
                      <animateTransform 
                        attributeName="transform" 
                        type="rotate" 
                        values="0 129 35; -15 129 35; -15 129 35; 0 129 35; 0 129 35"
                        keyTimes="0; 0.3; 0.5; 0.7; 1"
                        dur="8s" 
                        repeatCount="indefinite"
                      />
                    </rect>
                    <!-- Right finger -->
                    <rect x="146" y="35" width="10" height="35" fill="#5a5a6e" rx="4">
                      <animateTransform 
                        attributeName="transform" 
                        type="rotate" 
                        values="0 151 35; 15 151 35; 15 151 35; 0 151 35; 0 151 35"
                        keyTimes="0; 0.3; 0.5; 0.7; 1"
                        dur="8s" 
                        repeatCount="indefinite"
                      />
                    </rect>
                    <!-- Claw tip -->
                    <rect x="129" y="20" width="22" height="20" fill="#4a4a5e" rx="4"/>
                    <rect x="131" y="22" width="18" height="16" fill="#5a5a6e" rx="2"/>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>
    
    <div class="banner">
      <div class="banner-inner">
        <span class="wrench">🔧</span>
        <div>
          <h1>Under Construction</h1>
          <p class="subtitle">Building the future of robotics</p>
        </div>
        <span class="wrench">🔧</span>
      </div>
      <form class="email-form" onsubmit="event.preventDefault(); this.querySelector('.submit-btn').textContent='Sent!'; this.querySelector('.submit-btn').disabled=true;">
        <input type="email" class="email-input" placeholder="your@email.com" required>
        <button type="submit" class="submit-btn">Notify Me</button>
      </form>
    </div>
  </div>
</body>
</html>
