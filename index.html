<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robot Arms AI - Building the future of robotics automation">
  <title>Robot Arms AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.33);
      --accent2: #00d4ff;
      --text: #e0e0e8;
      --text-dim: #8888a0;
      --token-keyword: #ff79c6;
      --token-string: #f1fa8c;
      --token-function: #8be9fd;
      --token-number: #bd93f9;
      --token-variable: #50fa7b;
      --token-comment: #6272a4;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
    }
    
    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    /* Animated grid background */
    .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(var(--accent-glow) 1px, transparent 1px),
        linear-gradient(90deg, var(--accent-glow) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      opacity: 0.3;
    }
    
    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }
    
    /* Floating particles */
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.6;
      animation: particleFloat 8s ease-in-out infinite;
    }
    
    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; background: var(--token-variable); }
    .particle:nth-child(2) { left: 20%; top: 80%; animation-delay: 1s; background: var(--token-function); }
    .particle:nth-child(3) { left: 30%; top: 40%; animation-delay: 2s; background: var(--token-string); }
    .particle:nth-child(4) { left: 50%; top: 60%; animation-delay: 3s; background: var(--token-number); }
    .particle:nth-child(5) { left: 70%; top: 30%; animation-delay: 4s; background: var(--token-keyword); }
    .particle:nth-child(6) { left: 80%; top: 70%; animation-delay: 5s; background: var(--accent2); }
    .particle:nth-child(7) { left: 90%; top: 50%; animation-delay: 6s; background: var(--token-variable); }
    .particle:nth-child(8) { left: 15%; top: 55%; animation-delay: 7s; background: var(--token-function); }
    
    @keyframes particleFloat {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(100px, -50px) scale(1.5); opacity: 0.3; }
    }
    
    /* Code blocks */
    .code-block {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--bg-card);
      padding: 12px 16px;
      padding-top: 28px;
      border-radius: 8px;
      border: 1px solid #2a2a3e;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      white-space: nowrap;
      z-index: 10;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .code-block:hover {
      transform: scale(1.05) !important;
      box-shadow: 0 15px 50px rgba(108, 99, 255, 0.3);
      z-index: 15;
    }
    
    .code-block::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--token-variable);
      box-shadow: 12px 0 0 var(--token-string), 24px 0 0 var(--token-keyword);
    }
    
    .code-block::after {
      content: '';
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
    }
    
    .token { display: inline; }
    .keyword { color: var(--token-keyword); }
    .string { color: var(--token-string); }
    .func { color: var(--token-function); }
    .num { color: var(--token-number); }
    .var { color: var(--token-variable); }
    .comment { color: var(--token-comment); font-style: italic; }
    
    .block-1 {
      top: 12%;
      left: 8%;
      animation: float1 6s ease-in-out infinite;
    }
    
    .block-2 {
      top: 20%;
      right: 10%;
      animation: float2 7s ease-in-out infinite;
    }
    
    .block-3 {
      bottom: 22%;
      left: 12%;
      animation: float3 5s ease-in-out infinite;
    }
    
    .block-4 {
      bottom: 28%;
      right: 8%;
      animation: float1 8s ease-in-out infinite reverse;
    }
    
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) rotate(-2deg); }
      50% { transform: translate(20px, -30px) rotate(2deg); }
    }
    
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) rotate(3deg); }
      50% { transform: translate(-25px, -20px) rotate(-2deg); }
    }
    
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) rotate(-1deg); }
      50% { transform: translate(15px, -25px) rotate(3deg); }
    }
    
    /* Robot Arm */
    .robot-arm {
      width: 450px;
      height: 350px;
      z-index: 5;
      filter: drop-shadow(0 0 20px var(--accent-glow));
    }
    
    .arm-base {
      animation: basePulse 3s ease-in-out infinite;
    }
    
    @keyframes basePulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }
    
    .arm-segment-1 {
      transform-origin: 200px 190px;
      animation: armSwing1 3s ease-in-out infinite;
    }
    
    .arm-segment-2 {
      transform-origin: 200px 95px;
      animation: armSwing2 3s ease-in-out infinite 0.5s;
    }
    
    .arm-segment-3 {
      transform-origin: 200px 50px;
      animation: armSwing3 3s ease-in-out infinite 1s;
    }
    
    .claw {
      transform-origin: 200px 50px;
      animation: clawMove 3s ease-in-out infinite;
    }
    
    .finger-left {
      transform-origin: 188px 35px;
      animation: fingerClose 3s ease-in-out infinite;
    }
    
    .finger-right {
      transform-origin: 212px 35px;
      animation: fingerClose 3s ease-in-out infinite reverse;
    }
    
    .joint {
      animation: jointGlow 3s ease-in-out infinite;
    }
    
    @keyframes basePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    
    @keyframes armSwing1 {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(12deg); }
    }
    
    @keyframes armSwing2 {
      0%, 100% { transform: rotate(15deg); }
      50% { transform: rotate(-20deg); }
    }
    
    @keyframes armSwing3 {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }
    
    @keyframes clawMove {
      0%, 100% { transform: translate(40px, -20px) rotate(-15deg); }
      33% { transform: translate(-30px, -60px) rotate(20deg); }
      66% { transform: translate(-60px, 20px) rotate(-10deg); }
    }
    
    @keyframes fingerClose {
      0%, 40%, 60%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-12deg); }
    }
    
    @keyframes jointGlow {
      0%, 100% { fill: #6a6a7e; }
      50% { fill: #8a8a9e; }
    }
    
    /* Glow line following gripper */
    .glow-trace {
      position: absolute;
      top: calc(50% - 80px);
      left: calc(50% + 130px);
      width: 80px;
      height: 80px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      opacity: 0;
      animation: glowPulse 3s ease-in-out infinite;
      pointer-events: none;
    }
    
    @keyframes glowPulse {
      0%, 100% { transform: translate(40px, -20px) scale(0.5); opacity: 0; }
      25% { transform: translate(-30px, -60px) scale(1); opacity: 0.8; }
      50% { transform: translate(-60px, 20px) scale(0.8); opacity: 0.4; }
      75% { transform: translate(20px, 30px) scale(1.2); opacity: 0.6; }
    }
    
    /* Banner */
    .banner {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    .banner-inner {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 40px;
      background: linear-gradient(135deg, #1a1a2e 0%, #12121a 100%);
      border: 1px solid var(--accent);
      border-radius: 12px;
      box-shadow: 
        0 0 30px var(--accent-glow),
        inset 0 0 30px rgba(108, 99, 255, 0.1);
      animation: bannerPulse 3s ease-in-out infinite;
    }
    
    @keyframes bannerPulse {
      0%, 100% { box-shadow: 0 0 30px var(--accent-glow), inset 0 0 30px rgba(108, 99, 255, 0.1); }
      50% { box-shadow: 0 0 50px var(--accent-glow), inset 0 0 40px rgba(108, 99, 255, 0.15); }
    }
    
    .wrench {
      font-size: 24px;
      animation: wrenchWave 1s ease-in-out infinite;
    }
    
    .wrench:last-child {
      animation-delay: 0.5s;
    }
    
    @keyframes wrenchWave {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }
    
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 1px;
    }
    
    /* Email signup form */
    .email-form {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    
    .email-input {
      padding: 10px 16px;
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(108, 99, 255, 0.3);
      border-radius: 8px;
      color: var(--text);
      width: 220px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    
    .email-input::placeholder {
      color: var(--text-dim);
    }
    
    .email-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    
    .submit-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, #8b7fff 100%);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px var(--accent-glow);
    }
    
    .submit-btn:active {
      transform: scale(0.98);
    }
    
    .form-message {
      font-size: 12px;
      margin-top: 8px;
      height: 16px;
    }
    
    .form-message.success { color: var(--token-variable); }
    .form-message.error { color: var(--token-keyword); }
    
    /* Logo text */
    .logo-text {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--text);
      opacity: 0.8;
    }
    
    .logo-text span {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .robot-arm { width: 300px; height: 230px; }
      .code-block { font-size: 10px; padding: 8px 12px; padding-top: 24px; }
      .block-1 { top: 8%; left: 3%; }
      .block-2 { top: 12%; right: 3%; }
      .block-3 { bottom: 28%; left: 3%; }
      .block-4 { bottom: 32%; right: 3%; }
      h1 { font-size: 20px; }
      .banner-inner { padding: 15px 20px; gap: 12px; }
      .logo-text { font-size: 14px; top: 3%; }
      .email-form { flex-direction: column; }
      .email-input { width: 100%; }
      .glow-trace { display: none; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- Background Grid -->
    <div class="grid"></div>
    
    <!-- Floating Particles -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    
    <!-- Logo -->
    <div class="logo-text">ROBOT<span>ARMS</span>.AI</div>
    
    <!-- Floating Code Blocks -->
    <div class="code-block block-1">
      <span class="token keyword">const</span> <span class="token var">robot</span> = <span class="token string">"ready"</span>
    </div>
    <div class="code-block block-2">
      <span class="token func">arm.move</span>(<span class="token num">360</span>)
    </div>
    <div class="code-block block-3">
      <span class="token keyword">if</span> (<span class="token var">optimize</span>) { <span class="token func">run</span>() }
    </div>
    <div class="code-block block-4">
      <span class="token comment">// coming soon</span>
    </div>
    
    <!-- Robot Arm SVG - 3 segments now -->
    <svg class="robot-arm" viewBox="0 0 400 350" xmlns="http://www.w3.org/2000/svg">
      <!-- Glow effect -->
      <defs>
        <radialGradient id="jointGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#6c63ff" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      
      <!-- Base -->
      <g class="arm-base">
        <rect x="170" y="280" width="60" height="50" fill="#2a2a3e" rx="8"/>
        <rect x="178" y="288" width="44" height="34" fill="#3a3a4e" rx="5"/>
        <rect x="185" y="295" width="30" height="20" fill="#1a1a2e" rx="3"/>
        <!-- Indicator lights -->
        <circle cx="192" cy="305" r="3" fill="#50fa7b" class="joint"/>
        <circle cx="200" cy="305" r="3" fill="#6c63ff" class="joint"/>
        <circle cx="208" cy="305" r="3" fill="#50fa7b" class="joint"/>
      </g>
      
      <!-- Arm Segment 1 -->
      <g class="arm-segment-1">
        <rect x="188" y="200" width="24" height="85" fill="#4a4a5e" rx="5"/>
        <rect x="192" y="205" width="16" height="75" fill="#5a5a6e" rx="3"/>
        <!-- Detail lines -->
        <rect x="195" y="215" width="10" height="2" fill="#6a6a7e"/>
        <rect x="195" y="235" width="10" height="2" fill="#6a6a7e"/>
        <rect x="195" y="255" width="10" height="2" fill="#6a6a7e"/>
      </g>
      
      <!-- Joint 1 -->
      <circle cx="200" cy="200" r="16" fill="#3a3a4e"/>
      <circle cx="200" cy="200" r="10" fill="url(#jointGlow)" filter="url(#glow)"/>
      <circle cx="200" cy="200" r="8" fill="#6a6a7e" class="joint"/>
      
      <!-- Arm Segment 2 -->
      <g class="arm-segment-2">
        <rect x="188" y="105" width="24" height="95" fill="#4a4a5e" rx="5"/>
        <rect x="192" y="110" width="16" height="85" fill="#5a5a6e" rx="3"/>
        <!-- Detail lines -->
        <rect x="195" y="125" width="10" height="2" fill="#6a6a7e"/>
        <rect x="195" y="150" width="10" height="2" fill="#6a6a7e"/>
        <rect x="195" y="175" width="10" height="2" fill="#6a6a7e"/>
      </g>
      
      <!-- Joint 2 -->
      <circle cx="200" cy="105" r="14" fill="#3a3a4e"/>
      <circle cx="200" cy="105" r="8" fill="url(#jointGlow)" filter="url(#glow)"/>
      <circle cx="200" cy="105" r="6" fill="#6a6a7e" class="joint"/>
      
      <!-- Arm Segment 3 -->
      <g class="arm-segment-3">
        <rect x="188" y="55" width="24" height="55" fill="#4a4a5e" rx="5"/>
        <rect x="192" y="60" width="16" height="45" fill="#5a5a6e" rx="3"/>
      </g>
      
      <!-- Joint 3 -->
      <circle cx="200" cy="55" r="12" fill="#3a3a4e"/>
      <circle cx="200" cy="55" r="6" fill="url(#jointGlow)" filter="url(#glow)"/>
      <circle cx="200" cy="55" r="5" fill="#6a6a7e" class="joint"/>
      
      <!-- Wrist/Claw -->
      <g class="claw">
        <rect x="182" y="25" width="36" height="35" fill="#4a4a5e" rx="6"/>
        <rect x="186" y="30" width="28" height="25" fill="#5a5a6e" rx="4"/>
        <g class="finger finger-left">
          <rect x="178" y="18" width="10" height="40" fill="#5a5a6e" rx="4"/>
          <rect x="180" y="22" width="6" height="32" fill="#6a6a7e" rx="2"/>
        </g>
        <g class="finger finger-right">
          <rect x="212" y="18" width="10" height="40" fill="#5a5a6e" rx="4"/>
          <rect x="214" y="22" width="6" height="32" fill="#6a6a7e" rx="2"/>
        </g>
      </g>
    </svg>
    
    <!-- Glow trace following gripper -->
    <div class="glow-trace"></div>
    
    <!-- Under Construction Banner -->
    <div class="banner">
      <div class="banner-inner">
        <span class="wrench">🔧</span>
        <div>
          <h1>Under Construction</h1>
          <p class="subtitle">Building the future of robotics</p>
        </div>
        <span class="wrench">🔧</span>
      </div>
      <form class="email-form" id="notifyForm">
        <input type="email" class="email-input" placeholder="your@email.com" required>
        <button type="submit" class="submit-btn">Notify Me</button>
      </form>
      <div class="form-message" id="formMessage"></div>
    </div>
    
    <script>
      document.getElementById('notifyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const input = this.querySelector('.email-input');
        const message = document.getElementById('formMessage');
        const btn = this.querySelector('.submit-btn');
        
        // Simulate submission
        btn.textContent = 'Sending...';
        btn.disabled = true;
        
        setTimeout(() => {
          message.textContent = 'Thanks! We\'ll keep you posted.';
          message.className = 'form-message success';
          input.value = '';
          btn.textContent = 'Notify Me';
          btn.disabled = false;
          
          // Clear message after 4 seconds
          setTimeout(() => {
            message.textContent = '';
          }, 4000);
        }, 1000);
      });
    </script>
  </div>
</body>
</html>
