<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robot Arms AI - Building the future of robotics automation">
  <title>Robot Arms AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.33);
      --accent2: #00d4ff;
      --text: #e0e0e8;
      --text-dim: #8888a0;
      --token-keyword: #ff79c6;
      --token-string: #f1fa8c;
      --token-function: #8be9fd;
      --token-number: #bd93f9;
      --token-variable: #50fa7b;
      --token-comment: #6272a4;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
    }
    
    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    /* Animated grid background */
    .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(var(--accent-glow) 1px, transparent 1px),
        linear-gradient(90deg, var(--accent-glow) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.3;
    }
    
    /* Code blocks */
    .code-block {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--bg-card);
      padding: 12px 16px;
      padding-top: 28px;
      border-radius: 8px;
      border: 1px solid #2a2a3e;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      white-space: nowrap;
      z-index: 10;
      transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
    }
    
    .code-block.grabbed {
      z-index: 25;
      box-shadow: 0 20px 60px rgba(108, 99, 255, 0.4);
    }
    
    .code-block::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--token-variable);
      box-shadow: 12px 0 0 var(--token-string), 24px 0 0 var(--token-keyword);
    }
    
    .code-block::after {
      content: '';
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
    }
    
    .token { display: inline; }
    .keyword { color: var(--token-keyword); }
    .string { color: var(--token-string); }
    .func { color: var(--token-function); }
    .num { color: var(--token-number); }
    .var { color: var(--token-variable); }
    .comment { color: var(--token-comment); font-style: italic; }
    
    /* Initial positions - where blocks start */
    .block-1 { top: 18%; left: 8%; }
    .block-2 { top: 15%; right: 10%; }
    .block-3 { bottom: 25%; left: 12%; }
    .block-4 { bottom: 22%; right: 10%; }
    
    /* Robot Arm Container */
    .robot-container {
      position: relative;
      width: 450px;
      height: 400px;
      z-index: 5;
    }
    
    .robot-arm {
      width: 100%;
      height: 100%;
    }
    
    /* Gripper that follows claw */
    .gripper {
      position: absolute;
      width: 60px;
      height: 50px;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
    }
    
    .gripper.active {
      opacity: 1;
    }
    
    .gripper-left, .gripper-right {
      position: absolute;
      width: 10px;
      height: 35px;
      background: linear-gradient(180deg, #6a6a7e, #4a4a5e);
      border-radius: 3px;
      top: 10px;
    }
    
    .gripper-left {
      left: 8px;
      transform-origin: top center;
    }
    
    .gripper-right {
      right: 8px;
      transform-origin: top center;
    }
    
    .gripper-left.closed { transform: rotate(15deg); }
    .gripper-right.closed { transform: rotate(-15deg); }
    
    /* Banner */
    .banner {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    .banner-inner {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 40px;
      background: linear-gradient(135deg, #1a1a2e 0%, #12121a 100%);
      border: 1px solid var(--accent);
      border-radius: 12px;
      box-shadow: 
        0 0 30px var(--accent-glow),
        inset 0 0 30px rgba(108, 99, 255, 0.1);
    }
    
    .wrench {
      font-size: 24px;
      animation: wrenchWave 1s ease-in-out infinite;
    }
    
    .wrench:last-child {
      animation-delay: 0.5s;
    }
    
    @keyframes wrenchWave {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }
    
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 1px;
    }
    
    /* Email signup */
    .email-form {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    
    .email-input {
      padding: 10px 16px;
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(108, 99, 255, 0.3);
      border-radius: 8px;
      color: var(--text);
      width: 220px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    
    .email-input::placeholder { color: var(--text-dim); }
    .email-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    
    .submit-btn {
      padding: 10px 20px;
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, #8b7fff 100%);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px var(--accent-glow);
    }
    
    /* Logo */
    .logo-text {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text);
      opacity: 0.7;
      z-index: 30;
    }
    
    .logo-text span {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .robot-container { width: 300px; height: 280px; }
      .code-block { font-size: 10px; padding: 8px 12px; padding-top: 24px; }
      .block-1 { top: 12%; left: 3%; }
      .block-2 { top: 10%; right: 3%; }
      .block-3 { bottom: 28%; left: 3%; }
      .block-4 { bottom: 24%; right: 3%; }
      h1 { font-size: 20px; }
      .banner-inner { padding: 15px 20px; gap: 12px; }
      .logo-text { font-size: 14px; }
      .email-form { flex-direction: column; }
      .email-input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="grid"></div>
    <div class="logo-text">ROBOT<span>ARMS</span>.AI</div>
    
    <!-- Code blocks -->
    <div class="code-block block-1" id="block1">
      <span class="token keyword">const</span> <span class="token var">arm</span> = <span class="token func">createRobot</span>()
    </div>
    <div class="code-block block-2" id="block2">
      <span class="token var">arm</span>.<span class="token func">moveTo</span>(<span class="token num">x</span>, <span class="token num">y</span>)
    </div>
    <div class="code-block block-3" id="block3">
      <span class="token keyword">while</span> (<span class="token var">building</span>) { <span class="token func">run</span>() }
    </div>
    <div class="code-block block-4" id="block4">
      <span class="token comment">// Deploy: robotarms.ai</span>
    </div>
    
    <!-- Robot Arm -->
    <div class="robot-container" id="robotContainer">
      <svg class="robot-arm" viewBox="0 0 450 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Base -->
        <rect x="175" y="340" width="100" height="50" fill="#2a2a3e" rx="8"/>
        <rect x="185" y="350" width="80" height="30" fill="#3a3a4e" rx="5"/>
        <!-- Indicator lights -->
        <circle cx="205" cy="365" r="4" fill="#50fa7b" id="light1"/>
        <circle cx="225" cy="365" r="4" fill="#6c63ff" id="light2"/>
        <circle cx="245" cy="365" r="4" fill="#50fa7b" id="light3"/>
        
        <!-- Arm group - this rotates the whole arm from base -->
        <g id="armGroup" style="transform-origin: 225px 340px;">
          <!-- Segment 1 (upper arm) -->
          <g id="seg1">
            <rect x="215" y="220" width="20" height="120" fill="#4a4a5e" rx="6"/>
            <rect x="218" y="225" width="14" height="110" fill="#5a5a6e" rx="4"/>
            <!-- Joint 1 -->
            <circle cx="225" cy="220" r="18" fill="#3a3a4e"/>
            <circle cx="225" cy="220" r="12" fill="#5a5a6e"/>
            <circle cx="225" cy="220" r="6" fill="#6a6a7e"/>
          </g>
          
          <!-- Segment 2 (forearm) - rotates relative to joint 1 -->
          <g id="seg2" style="transform-origin: 225px 220px;">
            <rect x="215" y="100" width="20" height="120" fill="#4a4a5e" rx="6"/>
            <rect x="218" y="105" width="14" height="110" fill="#5a5a6e" rx="4"/>
            <!-- Joint 2 -->
            <circle cx="225" cy="100" r="15" fill="#3a3a4e"/>
            <circle cx="225" cy="100" r="9" fill="#5a5a6e"/>
            <circle cx="225" cy="100" r="5" fill="#6a6a7e"/>
            
            <!-- Segment 3 (wrist) -->
            <g id="seg3" style="transform-origin: 225px 100px;">
              <rect x="215" y="55" width="20" height="50" fill="#4a4a5e" rx="5"/>
              <rect x="218" y="58" width="14" height="44" fill="#5a5a6e" rx="3"/>
              <!-- Joint 3 (wrist) -->
              <circle cx="225" cy="55" r="12" fill="#3a3a4e"/>
              <circle cx="225" cy="55" r="7" fill="#5a5a6e"/>
              
              <!-- Claw base -->
              <rect x="210" y="25" width="30" height="35" fill="#4a4a5e" rx="5"/>
              
              <!-- Claw fingers -->
              <g id="fingerLeft" style="transform-origin: 215px 25px;">
                <rect x="205" y="10" width="10" height="40" fill="#5a5a6e" rx="4"/>
                <rect x="207" y="14" width="6" height="32" fill="#6a6a7e" rx="2"/>
              </g>
              <g id="fingerRight" style="transform-origin: 235px 25px;">
                <rect x="235" y="10" width="10" height="40" fill="#5a5a6e" rx="4"/>
                <rect x="237" y="14" width="6" height="32" fill="#6a6a7e" rx="2"/>
              </g>
            </g>
          </g>
        </g>
      </svg>
      
      <!-- Visual gripper overlay -->
      <div class="gripper" id="gripper">
        <div class="gripper-left" id="gripperLeft"></div>
        <div class="gripper-right" id="gripperRight"></div>
      </div>
    </div>
    
    <!-- Banner -->
    <div class="banner">
      <div class="banner-inner">
        <span class="wrench">🔧</span>
        <div>
          <h1>Under Construction</h1>
          <p class="subtitle">Building the future of robotics</p>
        </div>
        <span class="wrench">🔧</span>
      </div>
      <form class="email-form" onsubmit="event.preventDefault(); this.querySelector('.submit-btn').textContent='Thanks!'; this.querySelector('.submit-btn').disabled=true;">
        <input type="email" class="email-input" placeholder="your@email.com" required>
        <button type="submit" class="submit-btn">Notify Me</button>
      </form>
    </div>
  </div>
  
  <script>
    // Robot arm controller
    class RobotArm {
      constructor() {
        this.armGroup = document.getElementById('armGroup');
        this.seg1 = document.getElementById('seg1');
        this.seg2 = document.getElementById('seg2');
        this.seg3 = document.getElementById('seg3');
        this.fingerLeft = document.getElementById('fingerLeft');
        this.fingerRight = document.getElementById('fingerRight');
        this.gripper = document.getElementById('gripper');
        this.gripperLeft = document.getElementById('gripperLeft');
        this.gripperRight = document.getElementById('gripperRight');
        this.container = document.getElementById('robotContainer');
        this.blocks = [
          document.getElementById('block1'),
          document.getElementById('block2'),
          document.getElementById('block3'),
          document.getElementById('block4')
        ];
        
        // Animation state
        this.heldBlock = null;
        this.animationDuration = 2000; // ms for each major movement
        
        // Joint angles (degrees)
        this.armAngle = 0;    // Whole arm rotation
        this.seg1Angle = 0;   // Upper arm
        this.seg2Angle = 0;   // Forearm  
        this.seg3Angle = 0;   // Wrist
        
        // Claw state
        this.clawOpen = true;
      }
      
      // Convert block position to joint angles (inverse kinematics simplified)
      calculateAngles(targetX, targetY) {
        // Normalize target to container coordinates
        const rect = this.container.getBoundingClientRect();
        const centerX = 225; // Arm base X in SVG
        const centerY = 340; // Arm base Y in SVG
        
        // Calculate relative position
        const relX = targetX - rect.left - centerX;
        const relY = centerY - (targetY - rect.top);
        
        // Distance from base
        const distance = Math.sqrt(relX * relX + relY * relY);
        
        // Clamp to reachable area
        const maxReach = 280;
        const minReach = 60;
        const clampedDist = Math.min(maxReach, Math.max(minReach, distance));
        
        // Base rotation angle
        this.armAngle = Math.atan2(relX, relY) * (180 / Math.PI);
        
        // Simplified 2-link arm angles
        // Assuming upper arm length ~120, forearm ~100, wrist ~50
        const upperArm = 100;
        const forearm = 90;
        
        // Elevation angle
        const elevation = Math.asin(Math.max(-1, Math.min(1, relY / distance))) * (180 / Math.PI);
        
        // Use law of cosines for elbow angle
        const cosElbow = (upperArm * upperArm + forearm * forearm - clampedDist * clampedDist) / (2 * upperArm * forearm);
        const elbowAngle = Math.acos(Math.max(-1, Math.min(1, cosElbow))) * (180 / Math.PI);
        
        // Shoulder angle
        const cosShoulder = (clampedDist * clampedDist + upperArm * upperArm - forearm * forearm) / (2 * clampedDist * upperArm);
        const shoulderAngle = Math.acos(Math.max(-1, Math.min(1, cosShoulder))) * (180 / Math.PI);
        
        this.seg1Angle = elevation + shoulderAngle - 90;
        this.seg2Angle = 180 - elbowAngle;
        this.seg3Angle = -this.seg1Angle - this.seg2Angle + 30;
        
        return { x: relX, y: relY, distance: clampedDist };
      }
      
      openClaw() {
        this.clawOpen = true;
        this.fingerLeft.style.transform = 'rotate(0deg)';
        this.fingerRight.style.transform = 'rotate(0deg)';
        this.gripperLeft.classList.remove('closed');
        this.gripperRight.classList.remove('closed');
      }
      
      closeClaw() {
        this.clawOpen = false;
        this.fingerLeft.style.transform = 'rotate(-15deg)';
        this.fingerRight.style.transform = 'rotate(15deg)';
        this.gripperLeft.classList.add('closed');
        this.gripperRight.classList.add('closed');
      }
      
      grabBlock(block) {
        if (this.heldBlock) return;
        this.heldBlock = block;
        block.classList.add('grabbed');
        this.closeClaw();
      }
      
      releaseBlock() {
        if (!this.heldBlock) return;
        this.heldBlock.classList.remove('grabbed');
        this.heldBlock = null;
        this.openClaw();
      }
      
      // Update gripper visual position
      updateGripperPosition() {
        const rect = this.container.getBoundingClientRect();
        const svg = this.container.querySelector('svg');
        const svgRect = svg.getBoundingClientRect();
        
        // Calculate where the claw is in screen coordinates
        // This is approximate since SVG transforms are complex
        const clawX = svgRect.left + 225 + 40; // Approximate claw position
        const clawY = svgRect.top + 60;
        
        this.gripper.style.left = (clawX - rect.left - 30) + 'px';
        this.gripper.style.top = (clawY - rect.top) + 'px';
        
        if (this.heldBlock) {
          // Move held block to gripper position
          this.heldBlock.style.left = (clawX - rect.left - 40) + 'px';
          this.heldBlock.style.top = (clawY - rect.top + 50) + 'px';
        }
      }
      
      // Animate to position
      async animateTo(x, y, duration = this.animationDuration) {
        const target = this.calculateAngles(x, y);
        
        return new Promise(resolve => {
          const startTime = performance.now();
          const startArmAngle = this.armAngle;
          const startSeg1Angle = this.seg1Angle;
          const startSeg2Angle = this.seg2Angle;
          const startSeg3Angle = this.seg3Angle;
          
          const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // Ease in-out
            const eased = progress < 0.5 
              ? 2 * progress * progress 
              : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            // Interpolate angles
            const currentArm = startArmAngle + (this.armAngle - startArmAngle) * eased;
            const currentSeg1 = startSeg1Angle + (this.seg1Angle - startSeg1Angle) * eased;
            const currentSeg2 = startSeg2Angle + (this.seg2Angle - startSeg2Angle) * eased;
            const currentSeg3 = startSeg3Angle + (this.seg3Angle - startSeg3Angle) * eased;
            
            // Apply transforms
            this.armGroup.style.transform = `rotate(${currentArm}deg)`;
            this.seg1.style.transform = `rotate(${currentSeg1}deg)`;
            this.seg2.style.transform = `rotate(${currentSeg2}deg)`;
            this.seg3.style.transform = `rotate(${currentSeg3}deg)`;
            
            this.updateGripperPosition();
            
            if (progress < 1) {
              requestAnimationFrame(animate);
            } else {
              resolve();
            }
          };
          
          requestAnimationFrame(animate);
        });
      }
      
      // Blink lights
      blinkLights() {
        const lights = ['light1', 'light2', 'light3'].map(id => document.getElementById(id));
        let state = false;
        setInterval(() => {
          lights.forEach((light, i) => {
            light.setAttribute('fill', state ? '#50fa7b' : '#6c63ff');
            setTimeout(() => {
              light.setAttribute('fill', '#50fa7b');
            }, 100);
          });
          state = !state;
        }, 500);
      }
      
      // Main animation sequence
      async runSequence() {
        const container = this.container;
        const rect = container.getBoundingClientRect();
        
        // Sequence: grab block 1, move it, release, grab block 2, etc.
        const sequence = [
          { block: 0, targetX: rect.left + rect.width * 0.5, targetY: rect.top + 150 },
          null, // release
          { block: 1, targetX: rect.left + rect.width * 0.5, targetY: rect.top + 120 },
          null,
          { block: 2, targetX: rect.left + rect.width * 0.5, targetY: rect.top + 180 },
          null,
          { block: 3, targetX: rect.left + rect.width * 0.5, targetY: rect.top + 140 },
          null,
        ];
        
        while (true) {
          for (const step of sequence) {
            if (step === null) {
              // Release and pause
              this.releaseBlock();
              await this.sleep(800);
            } else {
              // Move to block's current position first
              const block = this.blocks[step.block];
              const blockRect = block.getBoundingClientRect();
              
              // Move arm to hover over block
              await this.animateTo(blockRect.left + blockRect.width/2, blockRect.top + blockRect.height/2, 1500);
              await this.sleep(300);
              
              // Grab
              this.grabBlock(block);
              await this.sleep(300);
              
              // Move to target position
              await this.animateTo(step.targetX, step.targetY, 2000);
              await this.sleep(300);
              
              // Release
              this.releaseBlock();
              await this.sleep(500);
            }
          }
          
          // Return arm to rest position
          await this.animateTo(rect.left + rect.width * 0.35, rect.top + 250, 1500);
          await this.sleep(1000);
        }
      }
      
      sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }
      
      start() {
        this.blinkLights();
        
        // Start arm at rest position
        const rect = this.container.getBoundingClientRect();
        this.animateTo(rect.left + rect.width * 0.35, rect.top + 250, 1000);
        
        // Small idle animation
        setInterval(() => {
          if (!this.heldBlock) {
            this.seg2Angle += Math.sin(Date.now() / 1000) * 2;
            this.seg2.style.transform = `rotate(${this.seg2Angle}deg)`;
          }
        }, 50);
        
        // Start main sequence after delay
        setTimeout(() => this.runSequence(), 2000);
      }
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const robot = new RobotArm();
      robot.start();
    });
  </script>
</body>
</html>
