<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robot Arms AI - Building the future of robotics automation">
  <title>Robot Arms AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.33);
      --text: #e0e0e8;
      --text-dim: #8888a0;
      --token-keyword: #ff79c6;
      --token-string: #f1fa8c;
      --token-function: #8be9fd;
      --token-number: #bd93f9;
      --token-variable: #50fa7b;
      --token-comment: #6272a4;
      --token-operator: #ff79c6;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
    }
    
    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    /* Animated grid background */
    .grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(var(--accent-glow) 1px, transparent 1px),
        linear-gradient(90deg, var(--accent-glow) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      opacity: 0.3;
    }
    
    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }
    
    /* Code blocks */
    .code-block {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--bg-card);
      padding: 12px 16px;
      padding-top: 28px;
      border-radius: 8px;
      border: 1px solid #2a2a3e;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      white-space: nowrap;
      z-index: 10;
    }
    
    .code-block::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--token-variable);
      box-shadow: 12px 0 0 var(--token-string), 24px 0 0 var(--token-keyword);
    }
    
    .code-block::after {
      content: '';
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
    }
    
    .token { display: inline; }
    .keyword { color: var(--token-keyword); }
    .string { color: var(--token-string); }
    .func { color: var(--token-function); }
    .num { color: var(--token-number); }
    .var { color: var(--token-variable); }
    .comment { color: var(--token-comment); font-style: italic; }
    .op { color: var(--token-operator); }
    
    /* Code block positions and animations */
    .block-1 {
      top: 15%;
      left: 10%;
      animation: float1 6s ease-in-out infinite;
    }
    
    .block-2 {
      top: 25%;
      right: 12%;
      animation: float2 7s ease-in-out infinite;
    }
    
    .block-3 {
      bottom: 20%;
      left: 15%;
      animation: float3 5s ease-in-out infinite;
    }
    
    .block-4 {
      bottom: 30%;
      right: 10%;
      animation: float1 8s ease-in-out infinite reverse;
    }
    
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) rotate(-2deg); }
      50% { transform: translate(20px, -30px) rotate(2deg); }
    }
    
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) rotate(3deg); }
      50% { transform: translate(-25px, -20px) rotate(-2deg); }
    }
    
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) rotate(-1deg); }
      50% { transform: translate(15px, -25px) rotate(3deg); }
    }
    
    /* Robot Arm */
    .robot-arm {
      width: 400px;
      height: 300px;
      z-index: 5;
    }
    
    .arm-segment-1 {
      transform-origin: 200px 180px;
      animation: armSwing1 4s ease-in-out infinite;
    }
    
    .arm-segment-2 {
      transform-origin: 200px 80px;
      animation: armSwing2 4s ease-in-out infinite;
    }
    
    .claw {
      transform-origin: 200px 65px;
      animation: clawMove 4s ease-in-out infinite;
    }
    
    .finger-left {
      transform-origin: 189px 45px;
      animation: fingerClose 4s ease-in-out infinite;
    }
    
    .finger-right {
      transform-origin: 211px 45px;
      animation: fingerClose 4s ease-in-out infinite reverse;
    }
    
    @keyframes armSwing1 {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }
    
    @keyframes armSwing2 {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(-25deg); }
    }
    
    @keyframes clawMove {
      0%, 100% { transform: translate(30px, -10px) rotate(-10deg); }
      25% { transform: translate(-20px, -40px) rotate(15deg); }
      50% { transform: translate(-50px, 10px) rotate(-5deg); }
      75% { transform: translate(20px, 30px) rotate(10deg); }
    }
    
    @keyframes fingerClose {
      0%, 40%, 60%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    
    /* Gripper overlay */
    .gripper {
      position: absolute;
      top: calc(50% - 90px);
      left: calc(50% + 100px);
      width: 60px;
      height: 40px;
      z-index: 20;
      animation: gripperMove 4s ease-in-out infinite;
      pointer-events: none;
    }
    
    .gripper-left, .gripper-right {
      position: absolute;
      width: 12px;
      height: 40px;
      background: linear-gradient(180deg, #6a6a7e, #4a4a5e);
      border-radius: 4px;
    }
    
    .gripper-left {
      left: 8px;
      transform-origin: top center;
      animation: gripClose 4s ease-in-out infinite;
    }
    
    .gripper-right {
      right: 8px;
      transform-origin: top center;
      animation: gripClose 4s ease-in-out infinite reverse;
    }
    
    @keyframes gripperMove {
      0%, 100% { transform: translate(30px, -10px); }
      25% { transform: translate(-20px, -40px); }
      50% { transform: translate(-50px, 10px); }
      75% { transform: translate(20px, 30px); }
    }
    
    @keyframes gripClose {
      0%, 40%, 60%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }
    
    /* Banner */
    .banner {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
    }
    
    .banner-inner {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 40px;
      background: linear-gradient(135deg, #1a1a2e 0%, #12121a 100%);
      border: 1px solid var(--accent);
      border-radius: 12px;
      box-shadow: 
        0 0 30px var(--accent-glow),
        inset 0 0 30px rgba(108, 99, 255, 0.1);
      animation: bannerPulse 3s ease-in-out infinite;
    }
    
    @keyframes bannerPulse {
      0%, 100% { box-shadow: 0 0 30px var(--accent-glow), inset 0 0 30px rgba(108, 99, 255, 0.1); }
      50% { box-shadow: 0 0 50px var(--accent-glow), inset 0 0 40px rgba(108, 99, 255, 0.15); }
    }
    
    .wrench {
      font-size: 24px;
      animation: wrenchWave 1s ease-in-out infinite;
    }
    
    .wrench:last-child {
      animation-delay: 0.5s;
    }
    
    @keyframes wrenchWave {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }
    
    p {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 1px;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .robot-arm { width: 280px; height: 210px; }
      .code-block { font-size: 10px; padding: 8px 12px; padding-top: 24px; }
      .block-1 { top: 10%; left: 5%; }
      .block-2 { top: 15%; right: 5%; }
      .block-3 { bottom: 25%; left: 5%; }
      .block-4 { bottom: 30%; right: 5%; }
      h1 { font-size: 20px; }
      .banner-inner { padding: 15px 25px; gap: 12px; }
      .gripper { display: none; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- Background Grid -->
    <div class="grid"></div>
    
    <!-- Floating Code Blocks -->
    <div class="code-block block-1">
      <span class="token keyword">const</span> <span class="token var">robot</span> <span class="token op">=</span> <span class="token string">"awesome"</span>
    </div>
    <div class="code-block block-2">
      <span class="token func">arm.move</span>(<span class="token num">360</span>)
    </div>
    <div class="code-block block-3">
      <span class="token keyword">if</span> (<span class="token var">ready</span>) { <span class="token func">build</span>() }
    </div>
    <div class="code-block block-4">
      <span class="token comment">// coming soon</span>
    </div>
    
    <!-- Robot Arm SVG -->
    <svg class="robot-arm" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
      <!-- Base -->
      <rect x="175" y="250" width="50" height="40" fill="#2a2a3e" rx="5"/>
      <rect x="180" y="255" width="40" height="30" fill="#3a3a4e" rx="3"/>
      
      <!-- Arm Segment 1 -->
      <g class="arm-segment-1">
        <rect x="190" y="180" width="20" height="80" fill="#4a4a5e" rx="4"/>
        <rect x="193" y="185" width="14" height="70" fill="#5a5a6e" rx="2"/>
      </g>
      
      <!-- Joint 1 -->
      <circle cx="200" cy="180" r="14" fill="#3a3a4e"/>
      <circle cx="200" cy="180" r="8" fill="#6a6a7e"/>
      
      <!-- Arm Segment 2 -->
      <g class="arm-segment-2">
        <rect x="190" y="80" width="20" height="100" fill="#4a4a5e" rx="4"/>
        <rect x="193" y="85" width="14" height="90" fill="#5a5a6e" rx="2"/>
      </g>
      
      <!-- Joint 2 -->
      <circle cx="200" cy="80" r="12" fill="#3a3a4e"/>
      <circle cx="200" cy="80" r="6" fill="#6a6a7e"/>
      
      <!-- Wrist/Claw -->
      <g class="claw">
        <rect x="188" y="50" width="24" height="30" fill="#4a4a5e" rx="4"/>
        <g class="finger finger-left">
          <rect x="185" y="45" width="8" height="35" fill="#5a5a6e" rx="3"/>
        </g>
        <g class="finger finger-right">
          <rect x="207" y="45" width="8" height="35" fill="#5a5a6e" rx="3"/>
        </g>
      </g>
    </svg>
    
    <!-- Gripper that follows the claw -->
    <div class="gripper">
      <div class="gripper-left"></div>
      <div class="gripper-right"></div>
    </div>
    
    <!-- Under Construction Banner -->
    <div class="banner">
      <div class="banner-inner">
        <span class="wrench">🔧</span>
        <div>
          <h1>Under Construction</h1>
          <p>Building the future of robotics</p>
        </div>
        <span class="wrench">🔧</span>
      </div>
    </div>
  </div>
</body>
</html>
